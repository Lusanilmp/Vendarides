[build]
  publish = "dist"
  command = "npm run build"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[build.environment]
  # These values are already public in the browser client; private keys stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "VR_SUPABASE_URL,VR_SUPABASE_PUBLIC_KEY,VR_VAPID_PUBLIC_KEY"
